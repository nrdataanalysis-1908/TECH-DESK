[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tech-desk"
version = "0.1.1"
description = "NR TECH | IT Management & Support Center"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Nadison Roberto" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
techdesk = "techdesk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
